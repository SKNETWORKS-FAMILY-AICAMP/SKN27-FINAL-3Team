name: production-gate

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Contract and artifact gate
        run: >
          python -m pytest -q --timeout=30
          test/test_production_hardening_contract.py
          test/test_deployment_readiness_artifacts.py
          test/test_supervisor_production_contract.py
          test/test_api_route_specs.py

      - name: Phase 0 deterministic service-contract gate
        timeout-minutes: 10
        run: >
          python -m pytest -q --timeout=30
          test/test_attachment_document_classification_adapter.py
          test/test_legal_rag_service.py
          etl/fault_cases/src/agents/text_ml_case_search/tests/test_pgvector_unified_retriever.py

      - name: Phase 1 canonical and Explicit Mock boundary gate
        timeout-minutes: 10
        run: |
          python -m pytest -q --timeout=30 \
            test/test_phase_01_runtime_import_boundaries.py \
            test/test_phase_01_neutral_contracts.py \
            test/test_phase_01_mock_runtime_ownership.py \
            test/test_phase_01_mock_runtime_isolation.py \
            test/test_phase_01_attachment_staging_security.py \
            test/test_phase_01_collection_baseline_contract.py \
            test/test_phase_01_frontend_mock_surface.py
          python backend/manage.py test \
            chatbot.test_phase_01_mock_url_isolation \
            chatbot.test_phase_01_canonical_negative_reachability \
            chatbot.test_phase_01_canonical_persistence \
            chatbot.test_phase_01_dynamic_negative_reachability \
            chatbot.test_phase_01_legacy_marker_projection \
            chatbot.test_phase_01_smoke_file_scan_staging \
            chatbot.test_phase_01_attachment_scan_gate_compatibility \
            chatbot.test_phase_01_public_worker_node_isolation \
            chatbot.test_report_api_contract \
            --verbosity 1

      - name: Phase 1 attachment compatibility regressions
        timeout-minutes: 10
        run: >
          python backend/manage.py test
          chatbot.test_file_quarantine.FileQuarantinePipelineTests.test_object_read_rechecks_retention_under_the_database_fence
          chatbot.test_consultation_v2.ConsultationPersistenceSafetyTests.test_file_api_ignores_client_supplied_attachment_id
          chatbot.test_phase_01_attachment_scan_gate_compatibility
          --verbosity 1

      - name: Phase 1 all-public-worker Explicit Mock isolation
        timeout-minutes: 10
        run: >
          python backend/manage.py test
          chatbot.test_phase_01_public_worker_node_isolation
          --verbosity 1

      - name: Phase 2 B1 case workspace application boundary
        run: |
          python backend/manage.py test \
            chatbot.test_phase_02_case_workspace_use_case \
            --verbosity 1

      - name: Phase 2 B2 case fact confirmation application boundary
        run: |
          python backend/manage.py test \
            chatbot.test_phase_02_case_fact_confirmation_use_case \
            chatbot.test_consultation_v2.ConsultationCaseApiTests.test_fact_confirmation_precedes_real_worker_queue \
            --verbosity 1

      - name: Phase 2 B2 sensitivity negative controls
        timeout-minutes: 10
        env:
          PHASE_02_B2_SENSITIVITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/refactoring/verify_phase_02_b2_test_sensitivity.py

      - name: Upload Phase 2 B2 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-02-b2-sensitivity-evidence
          path: tmp/phase-02-b2-sensitivity-evidence.json
          retention-days: 14

      - name: Phase 2 B3 case analysis application boundary
        run: |
          python backend/manage.py test \
            chatbot.test_phase_02_case_analysis_use_case \
            chatbot.test_consultation_v2.ConsultationCaseApiTests.test_fact_confirmation_precedes_real_worker_queue \
            --verbosity 1

      - name: Phase 2 B3 sensitivity negative controls
        timeout-minutes: 10
        env:
          PHASE_02_B3_SENSITIVITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/refactoring/verify_phase_02_b3_test_sensitivity.py

      - name: Upload Phase 2 B3 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-02-b3-sensitivity-evidence
          path: tmp/phase-02-b3-sensitivity-evidence.json
          retention-days: 14

      - name: Full Django chatbot regression gate
        timeout-minutes: 30
        run: python backend/manage.py test chatbot --verbosity 1
      - name: Phase 2 D1 case list application boundary
        run: |
          python backend/manage.py test \
            chatbot.test_phase_02_case_list_use_case \
            chatbot.test_consultation_v2.ConsultationCaseApiTests.test_authenticated_user_creates_lists_and_reads_case_workspace \
            chatbot.test_consultation_v2.ConsultationCaseApiTests.test_case_creation_validates_typed_request_before_repository \
            --verbosity 1

      - name: Phase 2 D1 sensitivity negative controls
        timeout-minutes: 10
        env:
          PHASE_02_D1_SENSITIVITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/refactoring/verify_phase_02_d1_test_sensitivity.py

      - name: Upload Phase 2 D1 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-02-d1-sensitivity-evidence
          path: tmp/phase-02-d1-sensitivity-evidence.json
          retention-days: 14

      - name: Phase 2 D2 case creation application boundary
        timeout-minutes: 10
        run: |
          python backend/manage.py test \
            chatbot.test_phase_02_case_creation_use_case \
            chatbot.test_consultation_v2.ConsultationCaseApiTests.test_authenticated_user_creates_lists_and_reads_case_workspace \
            chatbot.test_consultation_v2.ConsultationCaseApiTests.test_case_creation_requires_authenticated_user \
            chatbot.test_consultation_v2.ConsultationCaseApiTests.test_case_creation_validates_typed_request_before_repository \
            chatbot.test_consultation_v2.ConsultationPersistenceSafetyTests.test_guest_case_promotion_requires_matching_guest_identity \
            chatbot.test_consultation_v2.ConsultationPersistenceSafetyTests.test_guest_case_promotion_rejects_active_unbound_worker_jobs \
            chatbot.test_consultation_v2.ConsultationPersistenceSafetyTests.test_guest_case_promotion_succeeds_after_worker_becomes_terminal \
            chatbot.test_consultation_v2.ConsultationPersistenceSafetyTests.test_case_creation_rejects_an_unpromoted_analysis_reservation \
            chatbot.test_consultation_v2.ConsultationPersistenceSafetyTests.test_guest_document_is_relinked_and_extended_when_session_becomes_a_case \
            chatbot.test_consultation_v2.ConsultationPersistenceSafetyTests.test_guest_case_promotion_transfers_job_and_report_ownership \
            --verbosity 1

      - name: Phase 2 D2 sensitivity negative controls
        timeout-minutes: 10
        env:
          PHASE_02_D2_SENSITIVITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/refactoring/verify_phase_02_d2_test_sensitivity.py

      - name: Upload Phase 2 D2 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-02-d2-sensitivity-evidence
          path: tmp/phase-02-d2-sensitivity-evidence.json
          retention-days: 14
      - name: Phase 2 D3 report document confirmation application boundary
        timeout-minutes: 10
        run: |
          python backend/manage.py test \
            chatbot.test_phase_02_report_document_confirmation_use_case \
            chatbot.test_phase_00_report_lifecycle \
            chatbot.test_supervisor_reporting_pipeline.DocumentConfirmationRepositoryTests \
            --verbosity 1
          python -m pytest -p no:cacheprovider test/test_api_route_specs.py -q

      - name: Phase 2 D3 sensitivity negative controls
        timeout-minutes: 10
        env:
          PHASE_02_D3_SENSITIVITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/refactoring/verify_phase_02_d3_test_sensitivity.py

      - name: Upload Phase 2 D3 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-02-d3-sensitivity-evidence
          path: tmp/phase-02-d3-sensitivity-evidence.json
          retention-days: 14
      - name: Phase 2 D4 conversation save-state application boundary
        timeout-minutes: 10
        run: |
          python backend/manage.py test \
            chatbot.test_phase_02_conversation_save_state_use_case \
            chatbot.test_chat_session_api_contract.ChatSessionApiContractTests \
            chatbot.test_guest_login_session_ownership_e2e.GuestLoginSessionOwnershipE2ETests.test_matching_guest_login_can_promote_all_resources_to_one_case \
            chatbot.test_guest_login_session_ownership_e2e.GuestLoginSessionOwnershipE2ETests.test_other_user_cannot_read_mutate_or_claim_promoted_resources \
            chatbot.test_resource_ownership_e2e.ResourceOwnershipE2ETests.test_attacker_cannot_access_or_mutate_any_owner_bound_resource \
            --verbosity 1
          python -m pytest -p no:cacheprovider \
            test/test_phase_02_conversation_save_state_sensitivity_runner.py \
            -q

      - name: Phase 2 D4 sensitivity negative controls
        timeout-minutes: 10
        env:
          PHASE_02_D4_SENSITIVITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/refactoring/verify_phase_02_conversation_save_state_test_sensitivity.py

      - name: Upload Phase 2 D4 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-02-d4-sensitivity-evidence
          path: tmp/phase-02-d4-sensitivity-evidence.json
          retention-days: 14
      - name: Phase 2 D5 Report read-query application boundary
        timeout-minutes: 10
        run: |
          python backend/manage.py test \
            chatbot.test_phase_02_report_read_queries_use_case \
            chatbot.test_report_api_contract \
            --verbosity 1
          python -m pytest -p no:cacheprovider \
            test/test_phase_02_d5_sensitivity_runner.py \
            -q

      - name: Phase 2 D5 sensitivity negative controls
        timeout-minutes: 10
        env:
          PHASE_02_D5_SENSITIVITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/refactoring/verify_phase_02_d5_report_read_queries_test_sensitivity.py

      - name: Upload Phase 2 D5 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-02-d5-sensitivity-evidence
          path: tmp/phase-02-d5-sensitivity-evidence.json
          retention-days: 14
      - name: Phase 2 D6 ListHistoryEvents application boundary
        timeout-minutes: 10
        run: |
          python backend/manage.py test \
            chatbot.test_phase_02_history_list_events_use_case \
            chatbot.test_history_api_contract \
            --verbosity 1
          python -m pytest -p no:cacheprovider \
            test/test_phase_02_d6_sensitivity_runner.py \
            -q

      - name: Phase 2 D6 sensitivity negative controls
        timeout-minutes: 10
        env:
          PHASE_02_D6_SENSITIVITY_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python scripts/refactoring/verify_phase_02_d6_history_list_events_test_sensitivity.py

      - name: Upload Phase 2 D6 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-02-d6-sensitivity-evidence
          path: tmp/phase-02-d6-sensitivity-evidence.json
          retention-days: 14
      - name: Pytest collection no-new-regression gate
        timeout-minutes: 10
        run: python scripts/refactoring/verify_pytest_collection_baseline.py

      - name: Upload pytest collection baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-01-pytest-collection-baseline
          path: tmp/phase-01-pytest-collection-baseline.json
          retention-days: 14

      - name: Phase 0 core user-flow characterization gate
        timeout-minutes: 10
        run: |
          python backend/manage.py test \
            chatbot.test_phase_00_core_user_flows \
            chatbot.test_phase_00_ocr_law_flow \
            chatbot.test_phase_00_report_lifecycle \
            chatbot.test_file_quarantine.FileQuarantinePipelineTests.test_multipart_registration_writes_only_to_quarantine \
            chatbot.test_consultation_v2.ConsultationCaseApiTests.test_fact_confirmation_precedes_real_worker_queue \
            --verbosity 1

      - name: Phase 0 sensitivity negative controls
        timeout-minutes: 10
        run: python scripts/refactoring/verify_phase_00_test_sensitivity.py

      - name: Upload Phase 0 sensitivity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-00-sensitivity-evidence
          path: tmp/phase-00-sensitivity-evidence.json
          retention-days: 14

      - name: Queued follow-up state regression
        timeout-minutes: 5
        run: >
          python backend/manage.py test
          chatbot.test_queued_followup_state_persistence
          --verbosity 1

      - name: OpenAPI v1 contract drift
        run: python scripts/generate_openapi_v1.py --check

      - name: Frontend Case route contract drift
        run: python scripts/generate_frontend_case_routes.py --check

      - name: Python static errors
        run: ruff check --select E9,F63,F7,F82 .
      - name: Phase 2 B2 unused import guard
        run: ruff check --select F401 app/application/cases/confirm_facts.py
      - name: Phase 2 B3 unused import guard
        run: ruff check --select F401 app/application/cases/start_analysis.py
      - name: Phase 2 D2 unused import guard
        run: ruff check --select F401 app/application/cases/create_case.py
      - name: Phase 2 D3 unused import guard
        run: ruff check --select F401 app/application/reports/confirm_document.py

      - name: Phase 2 D4 application import gate
        run: ruff check --select F401 app/application/chat/update_save_state.py

      - name: Phase 2 D5 application import gate
        run: ruff check --select F401 app/application/reports/read_queries.py
      - name: Phase 2 D6 application import gate
        run: ruff check --select F401 app/application/history/list_events.py
      - name: Secret and deployment artifacts
        run: python -m pytest test/test_deployment_readiness_artifacts.py -q

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/web/package-lock.json

      - name: Frontend dependency install
        working-directory: app/web
        run: npm ci

      - name: Phase 0 frontend characterization gate
        working-directory: app/web
        run: node --test ./*.test.js

      - name: Frontend production build
        working-directory: app/web
        run: npm run build

      - name: Frontend Explicit Mock build-surface gate
        run: python -m pytest -q --timeout=30 test/test_phase_01_frontend_mock_surface.py

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Terraform format and validate
        run: |
          terraform -chdir=infra/terraform fmt -check
          terraform -chdir=infra/terraform init -backend=false -input=false
          terraform -chdir=infra/terraform validate
          terraform -chdir=infra/terraform-pilot fmt -check
          terraform -chdir=infra/terraform-pilot init -backend=false -input=false
          terraform -chdir=infra/terraform-pilot validate

      - name: Docker build and import smoke
        run: |
          docker build -t skn27-production-gate .
          docker run --rm skn27-production-gate python -c "import app.services.chat_orchestration_service; import chatbot.runtime_health"

  compose-integration:
    needs: offline-verification
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Phase 0 Compose integration gate
        run: bash scripts/refactoring/run_phase_00_compose_gate.sh

      - name: Upload Phase 0 Compose evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-00-compose-evidence
          path: tmp/phase-00-compose-evidence/
          retention-days: 14
