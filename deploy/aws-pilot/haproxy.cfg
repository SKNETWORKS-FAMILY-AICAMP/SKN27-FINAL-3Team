global
  log stdout format raw local0
  maxconn 512

defaults
  log global
  mode http
  option httplog
  timeout connect 5s
  timeout client 60s
  timeout server 120s

frontend pilot_edge
  bind :8080
  stick-table type ip size 100k expire 10m store http_req_rate(10s)
  http-request track-sc0 hdr_ip(X-Forwarded-For,-1)

  acl api_path path_beg -i /api/
  acl mock_api_path path_beg -i /api/mock/
  acl google_code_path path -i /api/auth/google/code/
  acl abusive_api_rate sc_http_req_rate(0) gt 60
  http-request deny deny_status 404 if mock_api_path
  http-request track-sc1 hdr_ip(X-Forwarded-For,-1) table google_code_rates if google_code_path
  acl abusive_google_code_rate sc_http_req_rate(1) gt 10
  http-request deny deny_status 429 if google_code_path abusive_google_code_rate
  http-request deny deny_status 429 if api_path abusive_api_rate

  use_backend django if api_path
  default_backend static_frontend

backend django
  option httpchk
  http-check send meth GET uri /api/health/live/ hdr Host localhost hdr X-Forwarded-Proto https
  http-check expect status 200
  server backend backend:8000 check

backend static_frontend
  option httpchk GET /
  http-check expect status 200
  server frontend frontend:8080 check

backend google_code_rates
  stick-table type ip size 100k expire 10m store http_req_rate(1m)
