services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: skn27-demo-backend
    container_name: skn27-demo-backend
    environment:
      PYTHONUTF8: "1"
      DJANGO_DEBUG: "1"
      MOCK_REQUIRE_AUTH: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret}
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,[::1],backend"
      DJANGO_DATABASE_ENGINE: "postgres"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-law_db}
      REDIS_URL: "redis://redis:6379/0"
      PROGRESS_CACHE_TTL_SECONDS: "300"
      OBJECT_STORAGE_PROVIDER: "mock_s3"
      OBJECT_STORAGE_BUCKET: "skn27-demo-object-storage"
      OBJECT_STORAGE_PREFIX: "canonical"
      OBJECT_STORAGE_LOCAL_ROOT: "backend/media/mock_object_storage"
      OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS: "900"
      OBJECT_STORAGE_ENDPOINT_URL: "${OBJECT_STORAGE_ENDPOINT_URL:-}"
      OBJECT_STORAGE_REGION: "${OBJECT_STORAGE_REGION:-}"
      OBJECT_STORAGE_ACCESS_KEY_ID: "${OBJECT_STORAGE_ACCESS_KEY_ID:-}"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}"
      OBJECT_STORAGE_SESSION_TOKEN: ${OBJECT_STORAGE_SESSION_TOKEN:-}
      FILE_SCAN_PROVIDER: "${FILE_SCAN_PROVIDER:-local_policy}"
      FILE_SCAN_CLAMAV_HOST: "${FILE_SCAN_CLAMAV_HOST:-}"
      FILE_SCAN_CLAMAV_PORT: "${FILE_SCAN_CLAMAV_PORT:-3310}"
      FILE_SCAN_EXTERNAL_URL: "${FILE_SCAN_EXTERNAL_URL:-}"
      FILE_SCAN_EXTERNAL_API_KEY: ${FILE_SCAN_EXTERNAL_API_KEY:-}
      FILE_SCAN_MAX_BYTES: "${FILE_SCAN_MAX_BYTES:-52428800}"
      FILE_SCAN_REJECT_PII: "${FILE_SCAN_REJECT_PII:-0}"
      FILE_SCAN_TIMEOUT_SECONDS: "${FILE_SCAN_TIMEOUT_SECONDS:-10}"
      FILE_SCAN_EXTERNAL_INLINE_MAX_BYTES: "${FILE_SCAN_EXTERNAL_INLINE_MAX_BYTES:-5242880}"
      GOOGLE_AUTH_ALLOW_MOCK: "${GOOGLE_AUTH_ALLOW_MOCK:-1}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_POPUP_REDIRECT_URI: "${GOOGLE_POPUP_REDIRECT_URI:-http://127.0.0.1:${FRONTEND_PORT:-5173}}"
      APP_AUTH_ALLOW_MOCK_BEARER: "${APP_AUTH_ALLOW_MOCK_BEARER:-1}"
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-jwt-secret-change-before-deploy}
      OAUTH_TOKEN_SECRET: ${OAUTH_TOKEN_SECRET:-dev-oauth-secret-change-before-deploy}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPERVISOR_LLM_ENABLED: "${SUPERVISOR_LLM_ENABLED:-0}"
      SUPERVISOR_LLM_PROVIDER: "${SUPERVISOR_LLM_PROVIDER:-openai}"
      SUPERVISOR_LLM_MODEL: "${SUPERVISOR_LLM_MODEL:-gpt-5.4-mini}"
      SUPERVISOR_LLM_API_KEY: ${SUPERVISOR_LLM_API_KEY:-}
      SUPERVISOR_LLM_BASE_URL: "${SUPERVISOR_LLM_BASE_URL:-}"
      SUPERVISOR_LLM_TEMPERATURE: "${SUPERVISOR_LLM_TEMPERATURE:-0.1}"
      SUPERVISOR_LLM_TIMEOUT_SECONDS: "${SUPERVISOR_LLM_TIMEOUT_SECONDS:-12}"
      LEGAL_RAG_VECTOR_ENABLED: "${LEGAL_RAG_VECTOR_ENABLED:-0}"
      LEGAL_RAG_QUERY_EMBEDDING_PROVIDER: "${LEGAL_RAG_QUERY_EMBEDDING_PROVIDER:-sentence-transformers}"
      LEGAL_RAG_QUERY_EMBEDDING_MODEL: "${LEGAL_RAG_QUERY_EMBEDDING_MODEL:-intfloat/multilingual-e5-large}"
      LEGAL_RAG_QUERY_EMBEDDING_DIMENSIONS: "${LEGAL_RAG_QUERY_EMBEDDING_DIMENSIONS:-1024}"
      LEGAL_RAG_QUERY_EMBEDDING_DEVICE: "${LEGAL_RAG_QUERY_EMBEDDING_DEVICE:-cpu}"
      LEGAL_RAG_QUERY_EMBEDDING_TIMEOUT_SECONDS: "${LEGAL_RAG_QUERY_EMBEDDING_TIMEOUT_SECONDS:-12}"
      LEGAL_RAG_EMBEDDING_PROVIDER_FILTER: "${LEGAL_RAG_EMBEDDING_PROVIDER_FILTER:-}"
      LEGAL_RAG_OPENAI_API_KEY: ${LEGAL_RAG_OPENAI_API_KEY:-}
      LAW_GROUND_SEARCH_ENABLE_NEO4J: "${LAW_GROUND_SEARCH_ENABLE_NEO4J:-0}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - postgres
      - neo4j

  frontend:
    image: node:22-alpine
    container_name: skn27-demo-frontend
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: "http://backend:8000"
      VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
      VITE_DEV_AUTH_TOKEN: ${VITE_DEV_AUTH_TOKEN:-}
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./app/web:/app
      - frontend_node_modules:/app/node_modules

  redis:
    image: redis:7-alpine
    container_name: skn27-demo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    container_name: skn27-clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: skn27-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-law_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/schemas/law_db_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-law_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    container_name: skn27-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-change-me} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  data-seed:
    build:
      context: .
      dockerfile: Dockerfile
    image: skn27-demo-backend
    container_name: skn27-data-seed
    volumes:
      - .:/app
    command: python -m etl.legal.run_pipeline --client law_go_kr --provider openai --embedding-output law_embeddings_openai.jsonl --db-load
    environment:
      PYTHONUTF8: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-law_db}
      LAW_GO_KR_OC: ${LAW_GO_KR_OC:-}
      LAW_API_KEY: ${LAW_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LEGAL_RAG_OPENAI_API_KEY: ${LEGAL_RAG_OPENAI_API_KEY:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: "no"

  # ---------------------------------------------------------------------------
  # [PRECEDENT RAG - OPTIONAL / DISABLED]
  #
  # 아래 블록은 판례 RAG A/B 테스트용 Elasticsearch/Kibana 추가 후보입니다.
  # 현재 프로젝트의 기준 저장소는 PostgreSQL(pgvector)입니다.
  #
  # 최종 흐름:
  #   1. PostgreSQL에 판례 원본 저장
  #   2. PostgreSQL 기준 chunk 생성
  #   3. PostgreSQL pgvector에 embedding 저장
  #   4. Elasticsearch BM25 실험: chunk_text만 색인
  #   5. Elasticsearch vector/hybrid 실험: chunk_text + embedding_vector 색인
  #
  # 주의:
  #   - 기존 서비스는 충돌 방지를 위해 수정하지 않습니다.
  #   - Elasticsearch 내부 data volume은 artifacts/traffic_precedents_output과
  #     절대 섞지 않습니다.
  #   - 실제 활성화 시 아래 주석을 풀고 .env에 비밀번호를 분리하세요.
  #   - 참고 계획:
  #     etl/fault_cases/MD/판례/과실비율 판례 RAG 파이프라인 통합 최종 계획.md
  #
  elasticsearch:
    build:
      context: ./infra/elasticsearch
      dockerfile: Dockerfile
      args:
        ELASTICSEARCH_VERSION: ${ELASTICSEARCH_VERSION:-8.12.1}
    image: skn27-elasticsearch-nori:${ELASTICSEARCH_VERSION:-8.12.1}
    container_name: skn27-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-change-me}
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "${ELASTICSEARCH_PORT:-9200}:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -u elastic:${ELASTIC_PASSWORD:-change-me} -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
  
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.1
    container_name: skn27-kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_USERNAME=kibana_system
      - ELASTICSEARCH_PASSWORD=${KIBANA_SYSTEM_PASSWORD:-change-me}
      - SERVER_HOST=0.0.0.0
      - I18N_LOCALE=ko-KR
    ports:
      - "${KIBANA_PORT:-5601}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
  # ---------------------------------------------------------------------------

volumes:
  frontend_node_modules:
  postgres_data:
  clamav_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  # [PRECEDENT RAG - OPTIONAL / DISABLED]
  # Elasticsearch/Kibana 실험을 활성화할 때만 아래 volume 주석을 해제합니다.
  elasticsearch_data:
