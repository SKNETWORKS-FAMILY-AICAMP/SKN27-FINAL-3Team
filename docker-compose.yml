services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: skn27-demo-backend
    container_name: skn27-demo-backend
    command: sh -c "python backend/manage.py migrate --noinput && exec gunicorn --chdir backend --bind 0.0.0.0:8000 --workers ${WEB_CONCURRENCY:-3} --timeout 120 config.wsgi:application"
    environment: &backend-environment
      PYTHONUTF8: "1"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret}
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0,[::1],backend"
      DJANGO_DATABASE_ENGINE: "postgres"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-law_db}
      REDIS_URL: "redis://redis:6379/0"
      PROGRESS_CACHE_TTL_SECONDS: "300"
      OBJECT_STORAGE_PROVIDER: "mock_s3"
      OBJECT_STORAGE_BUCKET: "skn27-demo-object-storage"
      OBJECT_STORAGE_QUARANTINE_BUCKET: "skn27-demo-quarantine-storage"
      OBJECT_STORAGE_PREFIX: "canonical"
      OBJECT_STORAGE_LOCAL_ROOT: "backend/media/mock_object_storage"
      OBJECT_STORAGE_SIGNED_URL_TTL_SECONDS: "900"
      OBJECT_STORAGE_ENDPOINT_URL: "${OBJECT_STORAGE_ENDPOINT_URL:-}"
      OBJECT_STORAGE_REGION: "${OBJECT_STORAGE_REGION:-}"
      OBJECT_STORAGE_ACCESS_KEY_ID: "${OBJECT_STORAGE_ACCESS_KEY_ID:-}"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}"
      OBJECT_STORAGE_SESSION_TOKEN: ${OBJECT_STORAGE_SESSION_TOKEN:-}
      FILE_SCAN_PROVIDER: "${FILE_SCAN_PROVIDER:-local_policy}"
      FILE_UPLOAD_MAX_BYTES: "${FILE_UPLOAD_MAX_BYTES:-20971520}"
      FILE_SCAN_CLAMAV_HOST: "${FILE_SCAN_CLAMAV_HOST:-}"
      FILE_SCAN_CLAMAV_PORT: "${FILE_SCAN_CLAMAV_PORT:-3310}"
      FILE_SCAN_EXTERNAL_URL: "${FILE_SCAN_EXTERNAL_URL:-}"
      FILE_SCAN_EXTERNAL_API_KEY: ${FILE_SCAN_EXTERNAL_API_KEY:-}
      FILE_SCAN_MAX_BYTES: "${FILE_SCAN_MAX_BYTES:-52428800}"
      FILE_SCAN_REJECT_PII: "${FILE_SCAN_REJECT_PII:-0}"
      FILE_SCAN_TIMEOUT_SECONDS: "${FILE_SCAN_TIMEOUT_SECONDS:-10}"
      FILE_SCAN_EXTERNAL_INLINE_MAX_BYTES: "${FILE_SCAN_EXTERNAL_INLINE_MAX_BYTES:-5242880}"
      FILE_SCAN_CLAIM_STALE_AFTER_SECONDS: "${FILE_SCAN_CLAIM_STALE_AFTER_SECONDS:-300}"
      FILE_SCAN_RETRY_BACKOFF_SECONDS: "${FILE_SCAN_RETRY_BACKOFF_SECONDS:-60}"
      FILE_RETENTION_PURGE_LIMIT: "${FILE_RETENTION_PURGE_LIMIT:-100}"
      FILE_MAX_ATTACHMENTS_PER_REQUEST: "${FILE_MAX_ATTACHMENTS_PER_REQUEST:-20}"
      REPORT_STAGING_CLEANUP_LIMIT: "${REPORT_STAGING_CLEANUP_LIMIT:-100}"
      VISION_RUNTIME_PROVIDER: "${VISION_RUNTIME_PROVIDER:-local}"
      VISION_RUNTIME_TIMEOUT_SECONDS: "${VISION_RUNTIME_TIMEOUT_SECONDS:-180}"
      RUNPOD_API_KEY: ${RUNPOD_API_KEY:-}
      RUNPOD_VISION_ENDPOINT_ID: "${RUNPOD_VISION_ENDPOINT_ID:-}"
      RUNPOD_VISION_TIMEOUT_SECONDS: "${RUNPOD_VISION_TIMEOUT_SECONDS:-600}"
      RUNPOD_VISION_POLL_INTERVAL_SECONDS: "${RUNPOD_VISION_POLL_INTERVAL_SECONDS:-2}"
      RUNPOD_VISION_HTTP_TIMEOUT_SECONDS: "${RUNPOD_VISION_HTTP_TIMEOUT_SECONDS:-30}"
      RUNPOD_VISION_MAX_RESPONSE_BYTES: "${RUNPOD_VISION_MAX_RESPONSE_BYTES:-1048576}"
      RUNPOD_VISION_ALLOWED_HOSTS: "${RUNPOD_VISION_ALLOWED_HOSTS:-}"
      RUNPOD_VISION_DOWNLOAD_TIMEOUT_SECONDS: "${RUNPOD_VISION_DOWNLOAD_TIMEOUT_SECONDS:-60}"
      RUNPOD_VISION_MAX_DOWNLOAD_BYTES: "${RUNPOD_VISION_MAX_DOWNLOAD_BYTES:-52428800}"
      RUNPOD_VISION_EXECUTION_TIMEOUT_SECONDS: "${RUNPOD_VISION_EXECUTION_TIMEOUT_SECONDS:-540}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_POPUP_REDIRECT_URI: "${GOOGLE_POPUP_REDIRECT_URI:-http://127.0.0.1:${FRONTEND_PORT:-5173}}"
      GOOGLE_OAUTH_CODE_EXCHANGE_DAILY_LIMIT: "${GOOGLE_OAUTH_CODE_EXCHANGE_DAILY_LIMIT:-20}"
      GOOGLE_OAUTH_TRUSTED_PROXY_CIDRS: "${GOOGLE_OAUTH_TRUSTED_PROXY_CIDRS:-}"
      APP_JWT_SECRET: ${APP_JWT_SECRET:-dev-jwt-secret-change-before-deploy}
      OAUTH_TOKEN_SECRET: ${OAUTH_TOKEN_SECRET:-dev-oauth-secret-change-before-deploy}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SUPERVISOR_LLM_ENABLED: "${SUPERVISOR_LLM_ENABLED:-0}"
      SUPERVISOR_LLM_PROVIDER: "${SUPERVISOR_LLM_PROVIDER:-openai}"
      SUPERVISOR_LLM_MODEL: "${SUPERVISOR_LLM_MODEL:-gpt-5.4-mini}"
      SUPERVISOR_LLM_API_KEY: ${SUPERVISOR_LLM_API_KEY:-}
      SUPERVISOR_LLM_BASE_URL: "${SUPERVISOR_LLM_BASE_URL:-}"
      SUPERVISOR_LLM_TEMPERATURE: "${SUPERVISOR_LLM_TEMPERATURE:-0.1}"
      SUPERVISOR_LLM_TIMEOUT_SECONDS: "${SUPERVISOR_LLM_TIMEOUT_SECONDS:-12}"
      LEGAL_RAG_VECTOR_ENABLED: "${LEGAL_RAG_VECTOR_ENABLED:-0}"
      RAG_EMBEDDING_PROVIDER: "${RAG_EMBEDDING_PROVIDER:-openai}"
      RAG_EMBEDDING_MODEL: "${RAG_EMBEDDING_MODEL:-text-embedding-3-large}"
      RAG_EMBEDDING_DIMENSIONS: "${RAG_EMBEDDING_DIMENSIONS:-1024}"
      LEGAL_RAG_QUERY_EMBEDDING_PROVIDER: "${LEGAL_RAG_QUERY_EMBEDDING_PROVIDER:-openai}"
      LEGAL_RAG_QUERY_EMBEDDING_MODEL: "${LEGAL_RAG_QUERY_EMBEDDING_MODEL:-text-embedding-3-large}"
      LEGAL_RAG_QUERY_EMBEDDING_DIMENSIONS: "${LEGAL_RAG_QUERY_EMBEDDING_DIMENSIONS:-1024}"
      LEGAL_RAG_QUERY_EMBEDDING_DEVICE: "${LEGAL_RAG_QUERY_EMBEDDING_DEVICE:-cpu}"
      LEGAL_RAG_QUERY_EMBEDDING_TIMEOUT_SECONDS: "${LEGAL_RAG_QUERY_EMBEDDING_TIMEOUT_SECONDS:-12}"
      LEGAL_RAG_SEED_EMBEDDING_PROVIDER: "${LEGAL_RAG_SEED_EMBEDDING_PROVIDER:-}"
      LEGAL_RAG_SEED_EMBEDDING_MODEL: "${LEGAL_RAG_SEED_EMBEDDING_MODEL:-}"
      LEGAL_RAG_SEED_EMBEDDING_DIMENSIONS: "${LEGAL_RAG_SEED_EMBEDDING_DIMENSIONS:-}"
      LEGAL_RAG_OPENAI_API_KEY: ${LEGAL_RAG_OPENAI_API_KEY:-}
      APP_RELEASE_VERSION: "${APP_RELEASE_VERSION:-local-unversioned}"
      LEGAL_DATASET_VERSION: "${LEGAL_DATASET_VERSION:-unconfigured}"
      LEGAL_DATASET_VERIFIED_AT: "${LEGAL_DATASET_VERIFIED_AT:-}"
      LAW_GROUND_SEARCH_ENABLE_NEO4J: "${LAW_GROUND_SEARCH_ENABLE_NEO4J:-0}"
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
      # 인정기준 운영 Neo4j입니다. 기존 법률 Neo4j 환경변수와 분리합니다.
      FAULT_STANDARD_NEO4J_URI: "bolt://fault-standard-neo4j:7687"
      FAULT_STANDARD_NEO4J_USER: "${FAULT_STANDARD_NEO4J_USER:-neo4j}"
      FAULT_STANDARD_NEO4J_PASSWORD: ${FAULT_STANDARD_NEO4J_PASSWORD:-fault-standard-local-change-before-deploy}
      FAULT_STANDARD_NEO4J_DATABASE: "${FAULT_STANDARD_NEO4J_DATABASE:-neo4j}"
    ports:
      - "8000:8000"
    volumes:
      - object_storage_data:/app/backend/media/mock_object_storage
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started

  agent-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: skn27-demo-backend
    container_name: skn27-agent-worker
    command: sh -c "python backend/manage.py migrate --check && exec python backend/manage.py process_agent_work_items --loop --limit 10"
    environment: *backend-environment
    volumes:
      - object_storage_data:/app/backend/media/mock_object_storage
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_started
    healthcheck:
      disable: true
    restart: unless-stopped

  file-scan-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: skn27-demo-backend
    container_name: skn27-file-scan-worker
    command: sh -c "python backend/manage.py migrate --check && exec python backend/manage.py process_uploaded_file_scans --loop"
    environment:
      PYTHONUTF8: "1"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-secret}
      DJANGO_DATABASE_ENGINE: "postgres"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-law_db}
      OBJECT_STORAGE_PROVIDER: "mock_s3"
      OBJECT_STORAGE_BUCKET: "skn27-demo-object-storage"
      OBJECT_STORAGE_QUARANTINE_BUCKET: "skn27-demo-quarantine-storage"
      OBJECT_STORAGE_PREFIX: "canonical"
      OBJECT_STORAGE_LOCAL_ROOT: "backend/media/mock_object_storage"
      OBJECT_STORAGE_ENDPOINT_URL: "${OBJECT_STORAGE_ENDPOINT_URL:-}"
      OBJECT_STORAGE_REGION: "${OBJECT_STORAGE_REGION:-}"
      OBJECT_STORAGE_ACCESS_KEY_ID: "${OBJECT_STORAGE_ACCESS_KEY_ID:-}"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: "${OBJECT_STORAGE_SECRET_ACCESS_KEY:-}"
      OBJECT_STORAGE_SESSION_TOKEN: ${OBJECT_STORAGE_SESSION_TOKEN:-}
      FILE_SCAN_PROVIDER: "clamav"
      FILE_SCAN_CLAMAV_HOST: "clamav"
      FILE_SCAN_CLAMAV_PORT: "${FILE_SCAN_CLAMAV_PORT:-3310}"
      FILE_SCAN_MAX_BYTES: "${FILE_SCAN_MAX_BYTES:-52428800}"
      FILE_SCAN_REJECT_PII: "${FILE_SCAN_REJECT_PII:-0}"
      FILE_SCAN_TIMEOUT_SECONDS: "${FILE_SCAN_TIMEOUT_SECONDS:-10}"
      FILE_SCAN_CLAIM_STALE_AFTER_SECONDS: "${FILE_SCAN_CLAIM_STALE_AFTER_SECONDS:-300}"
      FILE_SCAN_RETRY_BACKOFF_SECONDS: "${FILE_SCAN_RETRY_BACKOFF_SECONDS:-60}"
      FILE_RETENTION_PURGE_LIMIT: "${FILE_RETENTION_PURGE_LIMIT:-100}"
    volumes:
      - object_storage_data:/app/backend/media/mock_object_storage
    depends_on:
      clamav:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    container_name: skn27-demo-frontend
    working_dir: /app
    environment:
      VITE_API_PROXY_TARGET: "http://backend:8000"
      VITE_GOOGLE_CLIENT_ID: "${VITE_GOOGLE_CLIENT_ID:-}"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./app/web:/app
      - frontend_node_modules:/app/node_modules

  redis:
    image: redis:7-alpine
    container_name: skn27-demo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  clamav:
    image: ${CLAMAV_IMAGE:-clamav/clamav:stable}
    container_name: skn27-clamav
    restart: unless-stopped
    ports:
      - "${CLAMAV_PORT:-3310}:3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postgres:
    image: ${POSTGRES_IMAGE:-pgvector/pgvector:pg16}
    container_name: skn27-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-law_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./storage/schemas/law_db_schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-law_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: ${NEO4J_IMAGE:-neo4j:5-community}
    container_name: skn27-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-change-me}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-change-me} 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 인정기준 운영 관계 그래프입니다. 실험 버전 라벨은 운영 DB에 적재하지 않습니다.
  # profiles를 명시해야만 실행되므로 기존 법률 Neo4j에는 영향을 주지 않습니다.
  fault-standard-neo4j:
    image: ${FAULT_STANDARD_NEO4J_IMAGE:-neo4j:5-community}
    container_name: fault-standard-neo4j
    profiles: ["fault-standard-rag"]
    restart: unless-stopped
    ports:
      - "7475:7474"
      - "7688:7687"
    environment:
      NEO4J_AUTH: neo4j/${FAULT_STANDARD_NEO4J_PASSWORD:-fault-standard-local-change-before-deploy}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - fault_standard_neo4j_operational_next_data:/data
      - fault_standard_neo4j_operational_next_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${FAULT_STANDARD_NEO4J_PASSWORD:-fault-standard-local-change-before-deploy} 'RETURN 1'"]
      interval: 10s
      # 초기 그래프 생성 직후 cypher-shell 준비 시간이 필요해 기존 법률 서비스보다 여유를 둔다.
      timeout: 20s
      retries: 10
      start_period: 60s

  data-seed:
    # Explicit/manual legacy ETL job. Production uses the verified manifest loader.
    profiles: ["seed"]
    build:
      context: .
      dockerfile: Dockerfile
    image: skn27-demo-backend
    container_name: skn27-data-seed
    volumes:
      - .:/app
    command: python -m etl.legal.run_pipeline --client law_go_kr --provider sentence-transformers --embedding-output law_embeddings_e5_large.jsonl --db-load
    environment:
      PYTHONUTF8: "1"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-law_db}
      LAW_GO_KR_OC: ${LAW_GO_KR_OC:-}
      LAW_API_KEY: ${LAW_API_KEY:-}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-change-me}
      NEO4J_DATABASE: ${NEO4J_DATABASE:-neo4j}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: "no"



volumes:
  frontend_node_modules:
  postgres_data:
  clamav_data:
  object_storage_data:
  neo4j_data:
  neo4j_logs:
  # 운영 이관 전후 모두 기존 법률 Neo4j 볼륨과 절대 공유하지 않습니다.
  fault_standard_neo4j_data:
  fault_standard_neo4j_logs:
  fault_standard_neo4j_operational_next_data:
    name: ${FAULT_STANDARD_NEO4J_DATA_VOLUME:-fault_standard_neo4j_operational_next_data}
  fault_standard_neo4j_operational_next_logs:
    name: ${FAULT_STANDARD_NEO4J_LOG_VOLUME:-fault_standard_neo4j_operational_next_logs}
  redis_data:
