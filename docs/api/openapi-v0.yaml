openapi: 3.2.0
info:
  title: SKN27 Traffic Dispute AI API
  summary: PM API JSON Schema OpenAPI contract for Django, Frontend, Supervisor, and Agent teams.
  version: 0.0.0
  description: |
    OpenAPI ver0 generated from the 2026-06-23 PM API JSON schema PDF and the
    repository Markdown follow-up notes. This is a contract-first draft, not a
    production guarantee.

    Contract statuses:
    - confirmed: reflected in the current Django mock/backend code or stable PM contract.
    - review_required: present in PM/meeting notes but still needs team confirmation.
    - internal_note: implementation or routing memo that should not be treated as a public API guarantee.
  x-contract-version: pm-api-json-schema.v0
  x-contract-date: "2026-06-28"
  x-distribution-date: "2026-06-29"
  x-openapi-source:
    pdf: C:/Users/Playdata/Downloads/pm-api-json-schema-spec-2026-06-23.pdf
    markdown: docs/pm-api-json-schema-spec-2026-06-23.md
  x-contract-status-policy:
    confirmed: Current mock implementation or stable cross-team JSON contract.
    review_required: 팀 조율을 위해 포함했지만 운영 구현 전 확인이 필요한 계약.
    internal_note: Captured as context only; do not expose as a public product promise.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: http://127.0.0.1:8000
    description: Local Django mock server
  - url: /
    description: Relative deployment root
security:
  - bearerAuth: []
tags:
  - name: Health
    description: Public health and demo scenario endpoints.
  - name: Auth
    description: Guest identity, current subject, and mock Bearer session boundaries.
  - name: Chat
    description: Chat session and user message entry points.
  - name: Files
    description: Attachment metadata, upload handoff, and Agent file routing.
  - name: Analysis Jobs
    description: Supervisor analysis job lifecycle and progress polling.
  - name: Analysis Results
    description: Frontend display DTO produced from Supervisor and Agent results.
  - name: Agents
    description: Agent registry, adapter contract, and mock execution endpoints.
  - name: Reports
    description: Report save, download, and objection draft contracts.
  - name: MyPage
    description: Review-required history and case summary candidates.
  - name: Mock Aliases
    description: Explicit mock endpoints kept for smoke tests and demo fixtures.
paths:
  /api/health/:
    get:
      tags: [Health]
      summary: Backend health check
      operationId: getHealth
      security: []
      x-contract-status: confirmed
      responses:
        "200":
          description: Health payload with scenario list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/mock/chat/scenarios/:
    get:
      tags: [Health, Mock Aliases]
      summary: List demo mock scenarios
      operationId: listMockChatScenarios
      security: []
      x-contract-status: confirmed
      responses:
        "200":
          description: Available mock scenarios.
          content:
            application/json:
              schema:
                type: object
                required: [scenarios]
                properties:
                  scenarios:
                    type: array
                items:
                  $ref: "#/components/schemas/DemoScenario"

  /api/auth/guest-session/:
    post:
      tags: [Auth]
      summary: Issue or refresh a guest identity
      operationId: createGuestSession
      security: []
      x-contract-status: confirmed
      x-review-note: Guest TTL, quota numbers, and account merge policy are still review-required.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSessionRequest"
            examples:
              withChatSession:
                value:
                  guest_id: gst_existing
                  session_id: ses_guest_chat
      responses:
        "200":
          description: Guest identity preview and merge/rate-limit policy.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - $ref: "#/components/schemas/GuestSessionResponse"

  /api/auth/me/:
    get:
      tags: [Auth]
      summary: Inspect current auth subject
      operationId: getCurrentAuthSubject
      security: []
      x-contract-status: confirmed
      x-review-note: Current mock validates Bearer shape only. Real JWT signature verification is review-required.
      parameters:
        - $ref: "#/components/parameters/GuestIdHeader"
        - $ref: "#/components/parameters/OptionalSessionId"
      responses:
        "200":
          description: Current anonymous, guest, or authenticated subject.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - $ref: "#/components/schemas/AuthSubjectResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/chat/sessions/:
    get:
      tags: [Chat]
      summary: List chat sessions
      operationId: listChatSessions
      x-contract-status: review_required
      x-review-note: Mentioned in PM/screen mapping, but current Django routes only implement POST.
      parameters:
        - $ref: "#/components/parameters/OptionalOwnerId"
      responses:
        "200":
          description: Candidate chat session list response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [sessions]
                    properties:
                      sessions:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChatSessionSummary"
        "401":
          $ref: "#/components/responses/AuthRequired"
    post:
      tags: [Chat]
      summary: Create a chat session
      operationId: createChatSession
      x-contract-status: confirmed
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChatSessionRequest"
            examples:
              guestSession:
                value:
                  user_id: null
              memberSession:
                value:
                  user_id: user_123
      responses:
        "200":
          description: Chat session created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - $ref: "#/components/schemas/CreateChatSessionResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/chat/sessions/{session_id}/messages/:
    get:
      tags: [Chat]
      summary: List messages in a chat session
      operationId: listChatSessionMessages
      x-contract-status: review_required
      x-review-note: Required by screen mapping, but not implemented in current Django urls.
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Candidate message history response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [session_id, messages]
                    properties:
                      session_id:
                        type: string
                      messages:
                        type: array
                        items:
                          $ref: "#/components/schemas/ChatMessageRecord"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/chat/messages/:
    post:
      tags: [Chat]
      summary: Submit a user message and create a Supervisor analysis plan
      operationId: submitChatMessage
      x-contract-status: confirmed
      description: |
        Accepts text and attachment references. The current implementation returns
        mock Supervisor output immediately and includes `analysis_plan` for Agent handoff.
      parameters:
        - $ref: "#/components/parameters/GuestIdHeader"
        - $ref: "#/components/parameters/AuthSessionIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageRequest"
            examples:
              fineNotice:
                value:
                  session_id: ses_demo
                  user_text: 이 고지서로 이의신청서를 만들 수 있을까요?
                  attachments:
                    - attachment_id: att_0001
                  mock_scenario: fine_notice
                  mock_status: success
              faultRatio:
                value:
                  session_id: ses_demo
                  user_text: 신호 없는 교차로 사고 과실비율 쟁점을 정리해줘
                  mock_scenario: fault_ratio
                  mock_status: partial
      responses:
        "200":
          description: Chat response and analysis plan.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - $ref: "#/components/schemas/ChatMessageResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/files/:
    get:
      tags: [Files]
      summary: List uploaded file metadata
      operationId: listFiles
      x-contract-status: confirmed
      parameters:
        - $ref: "#/components/parameters/OptionalSessionId"
      responses:
        "200":
          description: Attachment metadata list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [attachments]
                    properties:
                      attachments:
                        type: array
                        items:
                          $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/AuthRequired"
    post:
      tags: [Files]
      summary: Register or upload an attachment
      operationId: createFile
      x-contract-status: confirmed
      description: |
        The current Django implementation accepts JSON metadata or multipart upload.
        Canonical `/api/files/` persists metadata to the `uploaded_files` table while
        file bytes still use mock local storage until object storage is introduced.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentCreateRequest"
            examples:
              metadataOnly:
                value:
                  session_id: ses_demo
                  filename: accident_statement.pdf
                  content_type: application/pdf
                  purpose: accident_statement
                  size_bytes: 1204
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                session_id:
                  type: string
                purpose:
                  $ref: "#/components/schemas/AttachmentPurpose"
                owner_id:
                  type: string
      responses:
        "200":
          description: Registered attachment.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [attachment]
                    properties:
                      attachment:
                        $ref: "#/components/schemas/Attachment"
        "400":
          $ref: "#/components/responses/InvalidFile"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/files/{attachment_id}/:
    get:
      tags: [Files]
      summary: Get attachment metadata
      operationId: getFile
      x-contract-status: confirmed
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          description: Single attachment metadata.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [attachment]
                    properties:
                      attachment:
                        $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: Attachment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorEnvelope"

  /api/analysis/jobs/:
    get:
      tags: [Analysis Jobs]
      summary: List analysis jobs
      operationId: listAnalysisJobs
      x-contract-status: confirmed
      parameters:
        - $ref: "#/components/parameters/OptionalSessionId"
      responses:
        "200":
          description: Analysis job summaries.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [jobs]
                    properties:
                      jobs:
                        type: array
                        items:
                          $ref: "#/components/schemas/AnalysisJobSummary"
        "401":
          $ref: "#/components/responses/AuthRequired"
    post:
      tags: [Analysis Jobs]
      summary: Create an analysis job
      operationId: createAnalysisJob
      x-contract-status: confirmed
      description: Current mock implementation executes synchronously and stores a JSON sidecar.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisJobCreateRequest"
            examples:
              createFineNoticeJob:
                value:
                  session_id: ses_demo
                  user_text: 이 고지서로 이의신청서를 만들 수 있을까요?
                  attachments:
                    - attachment_id: att_0001
                  mock_scenario: fine_notice
                  mock_status: success
      responses:
        "200":
          description: Analysis job with raw mock execution details.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [job]
                    properties:
                      job:
                        $ref: "#/components/schemas/AnalysisJob"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/analysis/jobs/{job_id}/:
    get:
      tags: [Analysis Jobs]
      summary: Get analysis job status and raw mock details
      operationId: getAnalysisJob
      x-contract-status: confirmed
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Analysis job detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [job]
                    properties:
                      job:
                        $ref: "#/components/schemas/AnalysisJob"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: Analysis job not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorEnvelope"

  /api/analysis/results/{job_id}/:
    get:
      tags: [Analysis Results]
      summary: Get frontend display result for an analysis job
      operationId: getAnalysisResult
      x-contract-status: confirmed
      description: Returns display DTO only. Raw `analysis_plan`, `node_execution`, and `chat_response` stay on job detail.
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200":
          description: Display-ready analysis result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [result]
                    properties:
                      result:
                        $ref: "#/components/schemas/AnalysisResult"
        "401":
          $ref: "#/components/responses/AuthRequired"
        "404":
          description: Analysis result not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorEnvelope"

  /api/agents/nodes/:
    get:
      tags: [Agents]
      summary: List Agent and Supervisor node registry
      operationId: listAgentNodes
      x-contract-status: confirmed
      responses:
        "200":
          description: Agent node registry.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [nodes]
                    properties:
                      nodes:
                        type: array
                        items:
                          $ref: "#/components/schemas/AgentNode"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/agents/nodes/run/:
    post:
      tags: [Agents]
      summary: Run one Agent node in mock mode
      operationId: runAgentNode
      x-contract-status: confirmed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentNodeRunRequest"
            examples:
              lawNode:
                value:
                  node_code: law_ground_search
                  analysis_plan_id: plan_demo
                  job_id: job_demo
                  session_id: ses_demo
                  message_id: msg_demo
                  user_text: 법률 근거를 확인해줘
                  mock_status: success
      responses:
        "200":
          description: Mock node execution envelope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - $ref: "#/components/schemas/AgentNodeExecution"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/agents/plans/run/:
    post:
      tags: [Agents]
      summary: Run all Agent nodes in an analysis plan in mock mode
      operationId: runAgentPlan
      x-contract-status: confirmed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentPlanRunRequest"
      responses:
        "200":
          description: Plan execution result.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [analysis_plan, node_execution]
                    properties:
                      analysis_plan:
                        $ref: "#/components/schemas/AnalysisPlan"
                      node_execution:
                        $ref: "#/components/schemas/AgentPlanExecution"
                      chat_response:
                        $ref: "#/components/schemas/ChatMessageResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/reports/:
    get:
      tags: [Reports]
      summary: List saved reports
      operationId: listReports
      x-contract-status: review_required
      x-review-note: Required by screen mapping and ERD, but current Django route only implements POST.
      parameters:
        - $ref: "#/components/parameters/OptionalSessionId"
      responses:
        "200":
          description: Candidate report list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [reports]
                    properties:
                      reports:
                        type: array
                        items:
                          $ref: "#/components/schemas/ReportSummary"
        "401":
          $ref: "#/components/responses/AuthRequired"
    post:
      tags: [Reports]
      summary: Save or request a report action
      operationId: createReportAction
      x-contract-status: confirmed
      description: Current mock route accepts report save/download actions. The objection-draft-specific API remains review-required.
      parameters:
        - $ref: "#/components/parameters/GuestIdHeader"
        - $ref: "#/components/parameters/AuthSessionIdHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportActionRequest"
            examples:
              save:
                value:
                  action: save
                  case_id: case_demo
                  job_id: job_demo
                  result_id: res_demo
              download:
                value:
                  action: download
                  report_id: rep_demo
      responses:
        "200":
          description: Report action response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - $ref: "#/components/schemas/ReportActionResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/reports/{report_id}/:
    get:
      tags: [Reports]
      summary: Get report detail
      operationId: getReport
      x-contract-status: review_required
      x-review-note: Mentioned in PM mapping, but current Django urls only provide download detail.
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Candidate report detail.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - type: object
                    required: [report]
                    properties:
                      report:
                        $ref: "#/components/schemas/ReportDetail"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/reports/{report_id}/download/:
    get:
      tags: [Reports]
      summary: Download report artifact
      operationId: downloadReport
      x-contract-status: confirmed
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Mock text report download.
          headers:
            X-API-Surface:
              schema:
                type: string
                enum: [canonical_mock]
            X-Execution-Mode:
              schema:
                type: string
                enum: [mock]
            X-Report-Persistence:
              schema:
                type: string
                enum: [postgresql]
            X-Report-Storage-Backend:
              schema:
                type: string
                enum: [mock_placeholder, object_storage, local_file, unknown]
            X-Report-Storage-URI:
              schema:
                type: string
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/reports/objection-draft/:
    post:
      tags: [Reports]
      summary: Generate an objection draft
      operationId: createObjectionDraft
      x-contract-status: review_required
      x-review-note: Present in PDF/PM contract but not implemented in current Django urls. Current mock report action is `/api/reports/`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ObjectionDraftRequest"
      responses:
        "200":
          description: Candidate objection draft response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectionDraftResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/mypage/summary/:
    get:
      tags: [MyPage]
      summary: Get MyPage case and activity summary
      operationId: getMyPageSummary
      x-contract-status: confirmed
      x-review-note: Canonical mock read model is implemented from PostgreSQL metadata tables. Auth/session ownership and deadline calculations remain review-required.
      parameters:
        - $ref: "#/components/parameters/OptionalSessionId"
        - $ref: "#/components/parameters/OptionalOwnerId"
        - $ref: "#/components/parameters/OptionalUserId"
        - $ref: "#/components/parameters/OptionalLimit"
      responses:
        "200":
          description: MyPage summary backed by canonical mock persistence.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - $ref: "#/components/schemas/MyPageSummary"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/history/:
    get:
      tags: [MyPage]
      summary: List user history events
      operationId: listHistory
      x-contract-status: confirmed
      x-review-note: Mock sidecar implementation uses standard-light storage. TTL and DB migration remain review-required.
      parameters:
        - $ref: "#/components/parameters/OptionalSessionId"
        - $ref: "#/components/parameters/OptionalGuestId"
        - $ref: "#/components/parameters/OptionalUserId"
        - $ref: "#/components/parameters/OptionalJobId"
        - $ref: "#/components/parameters/OptionalEventType"
        - $ref: "#/components/parameters/OptionalLimit"
      responses:
        "200":
          description: Standard-light history event response.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CanonicalMockMeta"
                  - $ref: "#/components/schemas/HistoryEventListResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/mock/history/:
    get:
      tags: [MyPage, Mock Aliases]
      summary: Mock alias for history event list
      operationId: listMockHistory
      x-contract-status: confirmed
      parameters:
        - $ref: "#/components/parameters/OptionalSessionId"
        - $ref: "#/components/parameters/OptionalGuestId"
        - $ref: "#/components/parameters/OptionalUserId"
        - $ref: "#/components/parameters/OptionalJobId"
        - $ref: "#/components/parameters/OptionalEventType"
        - $ref: "#/components/parameters/OptionalLimit"
      responses:
        "200":
          description: Standard-light history event response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryEventListResponse"
        "401":
          $ref: "#/components/responses/AuthRequired"

  /api/mock/attachments/:
    get:
      tags: [Files, Mock Aliases]
      summary: Mock alias for listing attachment metadata
      operationId: listMockAttachments
      x-contract-status: confirmed
      parameters:
        - $ref: "#/components/parameters/OptionalSessionId"
      responses:
        "200":
          $ref: "#/components/responses/AttachmentList"
    post:
      tags: [Files, Mock Aliases]
      summary: Mock alias for registering attachment metadata
      operationId: createMockAttachment
      x-contract-status: confirmed
      requestBody:
        $ref: "#/components/requestBodies/AttachmentCreate"
      responses:
        "200":
          $ref: "#/components/responses/AttachmentCreated"

  /api/mock/attachments/{attachment_id}/:
    get:
      tags: [Files, Mock Aliases]
      summary: Mock alias for attachment detail
      operationId: getMockAttachment
      x-contract-status: confirmed
      parameters:
        - $ref: "#/components/parameters/AttachmentId"
      responses:
        "200":
          $ref: "#/components/responses/AttachmentCreated"
        "404":
          description: Attachment not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimpleErrorEnvelope"

  /api/mock/chat/sessions/:
    post:
      tags: [Chat, Mock Aliases]
      summary: Mock alias for creating chat sessions
      operationId: createMockChatSession
      x-contract-status: confirmed
