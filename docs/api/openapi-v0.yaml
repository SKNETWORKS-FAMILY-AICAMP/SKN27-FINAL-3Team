components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Current mock only validates Bearer header shape. Production JWT verification is review-required.

  parameters:
    OptionalSessionId:
      name: session_id
      in: query
      required: false
      schema:
        type: string
      description: Filter by chat session id.
    OptionalOwnerId:
      name: owner_id
      in: query
      required: false
      schema:
        type: string
      description: Candidate owner filter for member history.
    OptionalUserId:
      name: user_id
      in: query
      required: false
      schema:
        type: string
      description: Filter history by authenticated user id.
    OptionalGuestId:
      name: guest_id
      in: query
      required: false
      schema:
        type: string
      description: Filter history by guest id.
    OptionalJobId:
      name: job_id
      in: query
      required: false
      schema:
        type: string
      description: Filter history by analysis job id.
    OptionalEventType:
      name: event_type
      in: query
      required: false
      schema:
        type: string
      description: Filter history by event type.
    OptionalLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 100
      description: Maximum number of history events to return.
    GuestIdHeader:
      name: X-Guest-Id
      in: header
      required: false
      schema:
        type: string
      description: Guest identity used before login or during guest-to-member handoff.
    AuthSessionIdHeader:
      name: X-Auth-Session-Id
      in: header
      required: false
      schema:
        type: string
      description: Mock auth session id derived from the Bearer token.
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: string
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema:
        type: string
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        type: string
    ReportId:
      name: report_id
      in: path
      required: true
      schema:
        type: string

  requestBodies:
    AttachmentCreate:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AttachmentCreateRequest"
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file:
                type: string
                format: binary
              session_id:
                type: string
              purpose:
                $ref: "#/components/schemas/AttachmentPurpose"

  responses:
    AuthRequired:
      description: Authentication failed.
      headers:
        WWW-Authenticate:
          schema:
            type: string
          example: Bearer error="auth_required", error_description="missing_token"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthErrorEnvelope"
    InvalidRequest:
      description: Invalid request or missing required field.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    InvalidFile:
      description: Invalid or unsupported attachment.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiErrorEnvelope"
    AttachmentList:
      description: Attachment metadata list.
      content:
        application/json:
          schema:
            type: object
            required: [attachments]
            properties:
              attachments:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
    AttachmentCreated:
      description: Registered attachment.
      content:
        application/json:
          schema:
            type: object
            required: [attachment]
            properties:
              attachment:
                $ref: "#/components/schemas/Attachment"

  schemas:
    CanonicalMockMeta:
      type: object
      x-contract-status: confirmed
      properties:
        api_surface:
          type: string
          enum: [canonical_mock]
          description: Present on canonical `/api/...` responses while they reuse mock services.
        execution_mode:
          type: string
          enum: [mock]
          description: Current execution mode for canonical shadow endpoints.

    GuestSessionRequest:
      type: object
      properties:
        guest_id:
          type: string
          description: Existing guest id to refresh. If omitted, backend issues a mock id.
        session_id:
          type: string
          description: Chat session id to bind for preview only.

    GuestSessionResponse:
      type: object
      required: [auth_state, guest, subject, session_binding, rate_limit, merge_policy, limitations]
      properties:
        auth_state:
          type: string
          enum: [guest]
        guest:
          $ref: "#/components/schemas/GuestIdentity"
        subject:
          $ref: "#/components/schemas/AuthSubject"
        session_binding:
          $ref: "#/components/schemas/SessionBinding"
        rate_limit:
          $ref: "#/components/schemas/RateLimitPolicy"
        merge_policy:
          $ref: "#/components/schemas/MergePolicy"
        limitations:
          type: array
          items:
            type: string

    AuthSubjectResponse:
      type: object
      required: [auth_state, subject, rate_limit, merge_policy, limitations]
      properties:
        auth_state:
          type: string
          enum: [anonymous, guest, authenticated]
        user:
          type:
            - object
            - "null"
          properties:
            user_id:
              type: string
            display_name:
              type: string
            status:
              type: string
            policy_status:
              type: string
        guest:
          oneOf:
            - $ref: "#/components/schemas/GuestIdentity"
            - type: "null"
        subject:
          $ref: "#/components/schemas/AuthSubject"
        auth_session:
          oneOf:
            - $ref: "#/components/schemas/AuthSession"
            - type: "null"
        session_binding:
          $ref: "#/components/schemas/SessionBinding"
        rate_limit:
          $ref: "#/components/schemas/RateLimitPolicy"
        merge_policy:
          $ref: "#/components/schemas/MergePolicy"
        limitations:
          type: array
          items:
            type: string

    AuthContext:
      type: object
      x-contract-status: confirmed
      description: Frontend-provided identity context used to keep auth session and chat session separate.
      properties:
        auth_state:
          type: string
          enum: [anonymous, guest, authenticated]
        user_id:
          type:
            - string
            - "null"
        guest_id:
          type:
            - string
            - "null"
        auth_session_id:
          type:
            - string
            - "null"
        session_id:
          type:
            - string
            - "null"

    GuestIdentity:
      type: object
      properties:
        guest_id:
          type: string
        status:
          type: string
          enum: [active]
        issued_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        ttl_seconds:
          type: integer
        policy_status:
          type: string
          enum: [review_required, mock_only]

    AuthSubject:
      type: object
      required: [subject_id, subject_type, is_authenticated]
      properties:
        subject_id:
          type: string
        subject_type:
          type: string
          enum: [anonymous, guest, user]
        user_id:
          type:
            - string
            - "null"
        guest_id:
          type:
            - string
            - "null"
        auth_session_id:
          type:
            - string
            - "null"
        is_authenticated:
          type: boolean

    AuthSession:
      type: object
      properties:
        auth_session_id:
          type: string
        jwt_jti:
          type: string
        status:
          type: string
        verification:
          type: string

    SessionBinding:
      type: object
      properties:
        session_id:
          type:
            - string
            - "null"
        can_bind_to_chat_session:
          type: boolean
        binding_policy:
          type: string

    RateLimitPolicy:
      type: object
      properties:
        subject_id:
          type: string
        policy_status:
          type: string
          enum: [review_required]
        keys:
          type: array
          items:
            type: string
        notes:
          type: array
          items:
            type: string

    MergePolicy:
      type: object
      properties:
        guest_to_user_merge:
          type: string
          enum: [user_confirmation_required]
        auto_merge:
          type: boolean
        reason:
          type: string

    HealthResponse:
      type: object
      required: [ok, service, available_scenarios]
      properties:
        ok:
          type: boolean
        service:
          type: string
        available_scenarios:
          type: array
          items:
            $ref: "#/components/schemas/DemoScenario"

    DemoScenario:
      type: object
      required: [scenario, label]
      properties:
        scenario:
          type: string
          enum: [fine_notice, fault_ratio]
        label:
          type: string

    CreateChatSessionRequest:
      type: object
      properties:
        user_id:
          type:
            - string
            - "null"
          description: Null for guest session until login/session policy is finalized.
      x-review-note: Guest/member session retention policy is still review-required.

    CreateChatSessionResponse:
      type: object
      required: [session_id, status, created_at, available_scenarios]
      properties:
        session_id:
          type: string
        user_id:
          type:
            - string
            - "null"
        status:
          type: string
          enum: [draft, active, closed]
        created_at:
          type: string
          format: date-time
        available_scenarios:
          type: array
          items:
            $ref: "#/components/schemas/DemoScenario"

    ChatSessionSummary:
      type: object
      x-contract-status: review_required
      properties:
        session_id:
          type: string
        title:
          type: string
        last_summary:
          type: string
        status:
          type: string
        current_intent:
          $ref: "#/components/schemas/RoutingIntent"
        updated_at:
          type: string
          format: date-time

    ChatMessageRecord:
      type: object
      x-contract-status: review_required
      properties:
        message_id:
          type: string
        session_id:
          type: string
        role:
          type: string
          enum: [user, assistant, system]
        content:
          type: string
        routing_intent:
          $ref: "#/components/schemas/RoutingIntent"
        created_at:
          type: string
          format: date-time

    ChatMessageRequest:
      type: object
      required: [session_id]
      properties:
        session_id:
          type: string
        auth_context:
          $ref: "#/components/schemas/AuthContext"
        user_text:
          type: string
          description: Required when no usable attachment is provided.
        routing_intent:
          $ref: "#/components/schemas/RoutingIntent"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentReference"
        attachment_ids:
          type: array
          items:
            type: string
        mock_scenario:
          type: string
          enum: [fine_notice, fault_ratio]
        mock_status:
          type: string
          enum: [success, partial, pending, failed]
        needs_more_input:
          type: boolean
      anyOf:
        - required: [user_text]
        - required: [attachments]
        - required: [attachment_ids]

    ChatMessageResponse:
      type: object
      required:
        - message_id
        - session_id
        - routing_intent
        - status
        - assistant_message
        - progress
        - cards
        - report_links
        - limitations
        - analysis_plan
      properties:
        message_id:
          type: string
        session_id:
          type: string
        mock_scenario:
          type: string
          enum: [fine_notice, fault_ratio]
        routing_intent:
          $ref: "#/components/schemas/RoutingIntent"
        status:
          type: string
          enum: [success, partial, pending, failed]
        assistant_message:
          type: string
        progress:
          $ref: "#/components/schemas/ChatProgress"
        case_status:
          type: string
        cards:
          type: array
          items:
            $ref: "#/components/schemas/ResultCard"
        structured_result:
          type: object
          additionalProperties: true
        report_links:
          type: array
          items:
            $ref: "#/components/schemas/ReportLink"
        pending_questions:
          type: array
          items:
            $ref: "#/components/schemas/PendingQuestion"
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/AttachmentReference"
        attachment_resolution:
          $ref: "#/components/schemas/AttachmentResolution"
        analysis_plan:
          $ref: "#/components/schemas/AnalysisPlan"
        limitations:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    ChatProgress:
      type: object
      required: [status, active_node, message]
      properties:
        status:
          type: string
          enum: [queued, running, pending, success, partial, failed]
        active_node:
          type:
            - string
            - "null"
        message:
          type: string

    AttachmentPurpose:
      type: string
      enum:
        - fine_notice
        - accident_scene
        - evidence
        - accident_statement
        - blackbox_video
        - insurance_record
        - unknown
      x-contract-status: confirmed
      x-review-required-values:
        - accident_statement
        - blackbox_video
        - insurance_record
      x-review-note: PDF only contained the smaller public enum. Markdown and current mock code accept these extended values.

    AttachmentType:
      type: string
      enum: [image, video, document, pdf, text, file]

    InputModality:
      type: string
      enum: [text, image, video, document]

    AttachmentCreateRequest:
      type: object
      required: [session_id]
      properties:
        attachment_id:
          type: string
        session_id:
          type: string
        message_id:
          type: string
        owner_id:
          type: string
        user_id:
          type: string
        purpose:
          $ref: "#/components/schemas/AttachmentPurpose"
        type:
          $ref: "#/components/schemas/AttachmentType"
        filename:
          type: string
        original_filename:
          type: string
        content_type:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        storage_uri:
          type: string

    AttachmentReference:
      type: object
      required: [attachment_id]
      properties:
        attachment_id:
          type: string
        purpose:
          $ref: "#/components/schemas/AttachmentPurpose"
        type:
          $ref: "#/components/schemas/AttachmentType"
        original_filename:
          type: string
        filename:
          type: string
        content_type:
          type: string
        mime_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0
        storage_uri:
          type: string
        resolution_status:
          type: string
          enum: [resolved, inline_metadata, unresolved]

    Attachment:
      allOf:
        - $ref: "#/components/schemas/AttachmentReference"
        - type: object
          required: [session_id, status, storage_uri, agent_handoff]
          properties:
            session_id:
              type:
                - string
                - "null"
            message_id:
              type:
                - string
                - "null"
            status:
              type: string
              enum: [uploaded, metadata_registered]
            created_at:
              type: string
              format: date-time
            checks:
              type: object
              additionalProperties: true
            agent_handoff:
              $ref: "#/components/schemas/AgentAttachmentHandoff"
            limitations:
              type: array
              items:
                type: string
            persistence:
              type: object
              additionalProperties: true

    AgentAttachmentHandoff:
      type: object
      required: [attachment_id, purpose, type, storage_uri, content_type, size_bytes]
      properties:
        attachment_id:
          type: string
        purpose:
          $ref: "#/components/schemas/AttachmentPurpose"
        type:
          $ref: "#/components/schemas/AttachmentType"
        storage_uri:
          type: string
        content_type:
          type: string
        size_bytes:
          type: integer
          minimum: 0

    AttachmentResolution:
      type: object
      properties:
        resolved_attachment_ids:
          type: array
          items:
            type: string
        inline_attachment_ids:
          type: array
          items:
            type: string
        metadata_missing_attachment_ids:
          type: array
          items:
            type: string
        unresolved_attachment_ids:
          type: array
          items:
            type: string

    RoutingIntent:
      type: string
      enum:
        - fine_notice
        - law_question
        - fault_ratio
        - vision_analysis
        - objection_request
        - general

    JobStatus:
      type: string
      enum: [queued, running, success, partial, failed]

    AgentStatus:
      type: string
      enum: [success, partial, failed]

    AnalysisStepStatus:
      type: string
      enum: [ready, blocked, running, success, partial, failed, skipped]

    CardType:
      type: string
      enum:
        - fine_notice
        - fault_ratio
        - law_ground
        - vision
        - objection_report
        - similar_case
        - recommended_evidence

    PendingQuestion:
      type: object
      required: [field, question]
      properties:
        field:
          type: string
        question:
          type: string

    AnalysisPlan:
      type: object
      required:
        - plan_id
        - session_id
        - message_id
        - routing_intent
        - input_summary
        - required_inputs
        - pending_questions
        - steps
        - limitations
      properties:
        plan_id:
          type: string
        session_id:
          type: string
        message_id:
          type: string
        routing_intent:
          $ref: "#/components/schemas/RoutingIntent"
        input_summary:
          type: object
          required: [has_user_command, modalities, attachment_purposes]
          properties:
            has_user_command:
              type: boolean
            modalities:
              type: array
              items:
                $ref: "#/components/schemas/InputModality"
            attachment_purposes:
              type: array
              items:
                $ref: "#/components/schemas/AttachmentPurpose"
        required_inputs:
          type: array
          items:
            type: string
        pending_questions:
          type: array
          items:
            $ref: "#/components/schemas/PendingQuestion"
        steps:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisPlanStep"
        blocked_reason:
          type:
            - string
            - "null"
        limitations:
          type: array
          items:
            type: string

    AnalysisPlanStep:
      type: object
      required: [order, node_code, status, required_inputs, depends_on, fallback]
      properties:
        order:
          type: integer
        node_code:
          $ref: "#/components/schemas/NodeCode"
        status:
          $ref: "#/components/schemas/AnalysisStepStatus"
        required_inputs:
          type: array
          items:
            type: string
        depends_on:
          type: array
          items:
            $ref: "#/components/schemas/NodeCode"
        fallback:
          type: string

    AnalysisJobCreateRequest:
      allOf:
        - $ref: "#/components/schemas/ChatMessageRequest"
        - type: object
          properties:
            job_id:
              type: string
            mock_job_status:
              $ref: "#/components/schemas/JobStatus"

    AnalysisJobSummary:
      type: object
      required: [job_id, session_id, message_id, routing_intent, status, created_at, updated_at]
      properties:
        job_id:
          type: string
        session_id:
          type: string
        message_id:
          type: string
        routing_intent:
          $ref: "#/components/schemas/RoutingIntent"
        mock_scenario:
