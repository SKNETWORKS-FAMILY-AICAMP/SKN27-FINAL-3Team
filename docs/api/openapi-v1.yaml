openapi: 3.2.0
info:
  title: SKN27 Traffic Dispute AI API
  version: 1.0.0
  description: Generated shadow contract for executable Django API behavior. It does not replace urlpatterns
    while route specs remain shadow-only.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-contract-mode: shadow
paths:
  /api/cases/:
    get:
      tags:
      - Cases
      summary: List consultation cases owned by the authenticated user
      operationId: listConsultationCases
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-consultation-cases
      x-django-view: consultation_cases
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationCaseListResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - login_required
          x-response-semantics: authorization_denied
    post:
      tags:
      - Cases
      summary: Promote an authenticated consultation session to a Case
      operationId: createConsultationCase
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-consultation-cases
      x-django-view: consultation_cases
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConsultationCaseResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - login_required
          - case_owner_mismatch
          x-response-semantics: authorization_denied
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_not_found
        '409':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_conflict
        '422':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - validation_error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsultationCaseRequest'
  /api/cases/{case_id}/workspace/:
    get:
      tags:
      - Cases
      summary: Read the authenticated owner's Case workspace
      operationId: getConsultationCaseWorkspace
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-consultation-case-workspace
      x-django-view: consultation_case_workspace
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationCaseWorkspaceResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - login_required
          - object_access_denied
          x-response-semantics: authorization_denied
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_not_found
      parameters:
      - name: case_id
        in: path
        required: true
        description: Canonical consultation Case identifier
        schema:
          type: string
          minLength: 1
          maxLength: 64
  /api/cases/{case_id}/facts/confirm/:
    post:
      tags:
      - Cases
      summary: Create an immutable confirmed-facts version for a Case
      operationId: confirmConsultationCaseFacts
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-consultation-case-fact-confirmation
      x-django-view: consultation_case_fact_confirmation
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmCaseFactsResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - login_required
          - object_access_denied
          - case_owner_mismatch
          x-response-semantics: authorization_denied
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_not_found
        '409':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_conflict
        '422':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - validation_error
      parameters:
      - name: case_id
        in: path
        required: true
        description: Canonical consultation Case identifier
        schema:
          type: string
          minLength: 1
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCaseFactsRequest'
  /api/cases/{case_id}/analysis/jobs/:
    post:
      tags:
      - Cases
      summary: Queue analysis from an authenticated owner's confirmed facts
      operationId: startConsultationCaseAnalysis
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-consultation-case-analysis-jobs
      x-django-view: consultation_case_analysis_jobs
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartCaseAnalysisResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - login_required
          - object_access_denied
          - case_owner_mismatch
          x-response-semantics: authorization_denied
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_not_found
        '409':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_conflict
          - confirmed_facts_required
          - fact_readiness_not_met
        '422':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - validation_error
      parameters:
      - name: case_id
        in: path
        required: true
        description: Canonical consultation Case identifier
        schema:
          type: string
          minLength: 1
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCaseAnalysisRequest'
  /api/auth/guest-session/:
    post:
      tags:
      - Auth
      summary: Issue or refresh a guest identity
      operationId: createGuestSession
      security: []
      x-contract-status: shadow
      x-django-route-name: auth-guest-session
      x-django-view: guest_session
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionResponse'
      parameters:
      - name: X-Guest-Credential
        in: header
        required: false
        description: Signed guest credential required to prove a supplied guest identity.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSessionRequest'
  /api/auth/google/code/:
    post:
      tags:
      - Auth
      summary: Exchange a one-time Google authorization code for an app Bearer token
      operationId: exchangeGoogleAuthorizationCode
      security: []
      x-contract-status: shadow
      x-django-route-name: auth-google-code
      x-django-view: auth_google_code
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthorizationCodeResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - token_invalid
          x-response-semantics: authentication_failure
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - forbidden
          x-response-semantics: authorization_denied
        '503':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - provider_unavailable
        '429':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'
          x-error-codes:
          - rate_limit_exceeded
      parameters:
      - name: Origin
        in: header
        required: true
        description: Exact frontend origin configured for Google code exchange.
        schema:
          type: string
          format: uri
      - name: X-Requested-With
        in: header
        required: true
        description: Browser request marker required before Google provider exchange.
        schema:
          type: string
          enum:
          - XmlHttpRequest
      - name: X-Guest-Credential
        in: header
        required: false
        description: Signed guest credential required to prove a supplied guest identity.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthorizationCodeRequest'
  /api/auth/refresh/:
    post:
      tags:
      - Auth
      summary: Rotate a valid app Bearer token
      operationId: refreshAuthToken
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: auth-refresh
      x-django-view: auth_refresh
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenRefreshResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
          x-response-semantics: authentication_failure
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRefreshRequest'
  /api/auth/logout/:
    post:
      tags:
      - Auth
      summary: Revoke the current auth session and clear client auth state
      operationId: logoutAuthSession
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: auth-logout
      x-django-view: auth_logout
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogoutResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
          x-response-semantics: authentication_failure
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogoutRequest'
  /api/auth/me/:
    get:
      tags:
      - Auth
      summary: Inspect the current signed guest or authenticated subject
      operationId: getCurrentAuthSubject
      security:
      - bearerAuth: []
      - guestCredentialAuth: []
      x-contract-status: shadow
      x-django-route-name: auth-me
      x-django-view: auth_me
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSubjectResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
          x-response-semantics: authentication_failure
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - forbidden
          x-response-semantics: authorization_denied
        '503':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - provider_unavailable
      parameters:
      - name: X-Guest-Credential
        in: header
        required: false
        description: Signed guest credential required to prove a supplied guest identity.
        schema:
          type: string
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identifier. It is not valid identity proof without X-Guest-Credential.
        schema:
          type: string
      - name: guest_id
        in: query
        required: false
        description: Optional query fallback for the guest identity.
        schema:
          type: string
      - name: session_id
        in: query
        required: false
        description: Optional chat session binding identifier.
        schema:
          type: string
  /api/auth/resume/:
    get:
      tags:
      - Auth
      summary: Restore the latest consultation owned by the authenticated user
      operationId: getResumeManifest
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: auth-resume
      x-django-view: auth_resume
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeManifestResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
          x-response-semantics: authentication_failure
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - forbidden
          x-response-semantics: authorization_denied
  /api/chat/sessions/:
    post:
      tags:
      - Chat
      summary: Issue a draft chat session identifier; persistence occurs during message or save-state
        processing
      operationId: issueChatSessionDraft
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-create-chat-session
      x-django-view: create_chat_session
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionCreateResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
          - guest_session_invalid
          x-response-semantics: authentication_failure
      parameters:
      - name: X-Guest-Credential
        in: header
        required: false
        description: Signed guest credential required to prove a supplied guest identity.
        schema:
          type: string
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identifier. It is not valid identity proof without X-Guest-Credential.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionCreateRequest'
  /api/chat/messages/:
    post:
      tags:
      - Chat
      summary: Submit a chat turn and return immediate guidance, an asynchronous Worker receipt, or supervisor-unavailable
        state
      operationId: submitChatMessage
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-submit-chat-message
      x-django-view: submit_chat_message
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
        '409':
          description: Attachment scan blocked or a server-owned classification confirmation is stale;
            safe partial guidance is available.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
          x-response-semantics: partial_result
        '503':
          description: Supervisor planning is temporarily unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatMessageResponse'
          x-response-semantics: service_unavailable
        '400':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiErrorResponse'
          x-error-codes:
          - chat_input_rejected
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
          - guest_session_invalid
          x-response-semantics: authentication_failure
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiErrorResponse'
          x-error-codes:
          - object_access_denied
          x-response-semantics: authorization_denied
        '429':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiErrorResponse'
          x-error-codes:
          - rate_limit_exceeded
      parameters:
      - name: X-Guest-Credential
        in: header
        required: false
        description: Signed guest credential required to prove a supplied guest identity.
        schema:
          type: string
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identifier. It is not valid identity proof without X-Guest-Credential.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageRequest'
  /api/chat/save-state/:
    post:
      tags:
      - Chat
      summary: Update a conversation save preference; an unknown session returns 200 with skipped state
      operationId: updateChatSaveState
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-chat-save-state
      x-django-view: update_chat_save_state
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSaveStateResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
          - guest_session_invalid
          x-response-semantics: authentication_failure
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatApiErrorResponse'
          x-error-codes:
          - login_required
          - object_access_denied
          x-response-semantics: authorization_denied
      parameters:
      - name: X-Guest-Credential
        in: header
        required: false
        description: Signed guest credential required to prove a supplied guest identity.
        schema:
          type: string
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identifier. It is not valid identity proof without X-Guest-Credential.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSaveStateRequest'
  /api/mypage/summary/:
    get:
      tags:
      - MyPage
      summary: Read the authenticated user's summary after owner or session authorization
      operationId: getMyPageSummary
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-mypage-summary
      x-django-view: mypage_summary
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyPageSummaryResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
          x-response-semantics: authentication_failure
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - object_access_denied
          x-response-semantics: authorization_denied
      parameters:
      - name: session_id
        in: query
        required: false
        description: Optional chat session identifier used to scope the summary and session cache.
        schema:
          type: string
      - name: owner_id
        in: query
        required: false
        description: Optional owner identifier. When supplied, it takes precedence over user_id.
        schema:
          type: string
      - name: user_id
        in: query
        required: false
        description: Legacy owner alias used only when owner_id is absent.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Optional positive integer with a default of 10; invalid values fall back to that
          default.
        schema:
          type: string
  /api/history/:
    get:
      tags:
      - History
      summary: List the current subject's standard-light history events with owner-scoped filters
      operationId: listHistoryEvents
      security:
      - bearerAuth: []
      - guestCredentialAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-history-events
      x-django-view: history_events
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryListResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryApiErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
          x-response-semantics: authentication_failure
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryApiErrorResponse'
          x-error-codes:
          - object_access_denied
          x-response-semantics: authorization_denied
      parameters:
      - name: X-Guest-Credential
        in: header
        required: false
        description: Signed guest credential required to prove a supplied guest identity.
        schema:
          type: string
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identifier. It is not valid identity proof without X-Guest-Credential.
        schema:
          type: string
      - name: session_id
        in: query
        required: false
        description: Optional chat session identifier; the server verifies session ownership.
        schema:
          type: string
      - name: user_id
        in: query
        required: false
        description: Optional user identifier; the server verifies owner access.
        schema:
          type: string
      - name: guest_id
        in: query
        required: false
        description: Optional guest identifier; the server verifies guest access.
        schema:
          type: string
      - name: job_id
        in: query
        required: false
        description: Optional analysis job identifier; the server verifies its session owner.
        schema:
          type: string
      - name: event_type
        in: query
        required: false
        description: Optional history event type filter.
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Optional positive integer; invalid or non-positive values fall back and the default
          is 100.
        schema:
          type: string
  /api/files/:
    get:
      tags:
      - Files
      summary: List canonical file attachments visible to the current subject
      operationId: listFileAttachments
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-files
      x-django-view: attachments
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachmentListResponse'
        '401':
          description: Typed API error response
