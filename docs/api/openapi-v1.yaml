components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    guestCredentialAuth:
      type: apiKey
      in: header
      name: X-Guest-Credential
      description: Server-verified guest credential for protected guest routes.
  schemas:
    AnalysisJobAccepted:
      additionalProperties: true
      properties:
        job_id:
          maxLength: 128
          minLength: 1
          title: Job Id
          type: string
        status:
          maxLength: 64
          minLength: 1
          title: Status
          type: string
        contract_version:
          maxLength: 64
          minLength: 1
          title: Contract Version
          type: string
        session_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Session Id
        message_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Message Id
        execution_mode:
          maxLength: 64
          minLength: 1
          title: Execution Mode
          type: string
      required:
      - job_id
      - status
      - contract_version
      - execution_mode
      title: AnalysisJobAccepted
      type: object
    AnalysisJobAcceptedResponse:
      additionalProperties: true
      properties:
        job:
          $ref: '#/components/schemas/AnalysisJobAccepted'
      required:
      - job
      title: AnalysisJobAcceptedResponse
      type: object
    AnalysisJobSummary:
      additionalProperties: true
      properties:
        job_id:
          maxLength: 128
          minLength: 1
          title: Job Id
          type: string
        status:
          maxLength: 64
          minLength: 1
          title: Status
          type: string
      required:
      - job_id
      - status
      title: AnalysisJobSummary
      type: object
    AnalysisJobDetailResponse:
      additionalProperties: true
      properties:
        job:
          $ref: '#/components/schemas/AnalysisJobSummary'
      required:
      - job
      title: AnalysisJobDetailResponse
      type: object
    AnalysisJobError:
      additionalProperties: true
      properties:
        contract_version:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Contract Version
        type:
          anyOf:
          - maxLength: 64
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Type
        code:
          maxLength: 120
          minLength: 1
          title: Code
          type: string
        status:
          anyOf:
          - maximum: 599
            minimum: 400
            type: integer
          - type: 'null'
          default: null
          title: Status
        message:
          minLength: 1
          title: Message
          type: string
      required:
      - code
      - message
      title: AnalysisJobError
      type: object
    AnalysisJobErrorResponse:
      additionalProperties: true
