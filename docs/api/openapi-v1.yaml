openapi: 3.2.0
info:
  title: SKN27 Traffic Dispute AI API
  version: 1.0.0
  description: Generated shadow contract for executable Django API behavior. It does not replace urlpatterns
    while route specs remain shadow-only.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
x-contract-mode: shadow
paths:
  /api/cases/:
    get:
      tags:
      - Cases
      summary: List consultation cases owned by the authenticated user
      operationId: listConsultationCases
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-consultation-cases
      x-django-view: consultation_cases
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationCaseListResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - login_required
    post:
      tags:
      - Cases
      summary: Promote an authenticated consultation session to a Case
      operationId: createConsultationCase
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-consultation-cases
      x-django-view: consultation_cases
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateConsultationCaseResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - login_required
          - case_owner_mismatch
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_not_found
        '409':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_conflict
        '422':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - validation_error
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConsultationCaseRequest'
  /api/cases/{case_id}/workspace/:
    get:
      tags:
      - Cases
      summary: Read the authenticated owner's Case workspace
      operationId: getConsultationCaseWorkspace
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-consultation-case-workspace
      x-django-view: consultation_case_workspace
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationCaseWorkspaceResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - login_required
          - object_access_denied
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_not_found
      parameters:
      - name: case_id
        in: path
        required: true
        description: Canonical consultation Case identifier
        schema:
          type: string
          minLength: 1
          maxLength: 64
  /api/cases/{case_id}/facts/confirm/:
    post:
      tags:
      - Cases
      summary: Create an immutable confirmed-facts version for a Case
      operationId: confirmConsultationCaseFacts
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-consultation-case-fact-confirmation
      x-django-view: consultation_case_fact_confirmation
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmCaseFactsResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - login_required
          - object_access_denied
          - case_owner_mismatch
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_not_found
        '409':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_conflict
        '422':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - validation_error
      parameters:
      - name: case_id
        in: path
        required: true
        description: Canonical consultation Case identifier
        schema:
          type: string
          minLength: 1
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmCaseFactsRequest'
  /api/cases/{case_id}/analysis/jobs/:
    post:
      tags:
      - Cases
      summary: Queue analysis from an authenticated owner's confirmed facts
      operationId: startConsultationCaseAnalysis
      security:
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-consultation-case-analysis-jobs
      x-django-view: consultation_case_analysis_jobs
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartCaseAnalysisResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - login_required
          - object_access_denied
          - case_owner_mismatch
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_not_found
        '409':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - case_conflict
          - confirmed_facts_required
          - fact_readiness_not_met
        '422':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CaseApiErrorResponse'
          x-error-codes:
          - validation_error
      parameters:
      - name: case_id
        in: path
        required: true
        description: Canonical consultation Case identifier
        schema:
          type: string
          minLength: 1
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartCaseAnalysisRequest'
  /api/auth/guest-session/:
    post:
      tags:
      - Auth
      summary: Issue or refresh a guest identity
      operationId: createGuestSession
      security: []
      x-contract-status: shadow
      x-django-route-name: auth-guest-session
      x-django-view: guest_session
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GuestSessionResponse'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuestSessionRequest'
  /api/auth/google/code/:
    post:
      tags:
      - Auth
      summary: Exchange a one-time Google authorization code for an app Bearer token
      operationId: exchangeGoogleAuthorizationCode
      security: []
      x-contract-status: shadow
      x-django-route-name: auth-google-code
      x-django-view: auth_google_code
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleAuthorizationCodeResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - token_invalid
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - forbidden
        '503':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - provider_unavailable
        '429':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateLimitErrorResponse'
          x-error-codes:
          - rate_limit_exceeded
      parameters:
      - name: Origin
        in: header
        required: true
        description: Exact frontend origin configured for Google code exchange.
        schema:
          type: string
          format: uri
      - name: X-Requested-With
        in: header
        required: true
        description: Browser request marker required before Google provider exchange.
        schema:
          type: string
          enum:
          - XmlHttpRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthorizationCodeRequest'
  /api/auth/refresh/:
    post:
      tags:
      - Auth
      summary: Rotate a valid app Bearer token
      operationId: refreshAuthToken
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: auth-refresh
      x-django-view: auth_refresh
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenRefreshResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthTokenRefreshRequest'
  /api/auth/logout/:
    post:
      tags:
      - Auth
      summary: Revoke the current auth session and clear client auth state
      operationId: logoutAuthSession
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: auth-logout
      x-django-view: auth_logout
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLogoutResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - auth_required
          - token_invalid
          - token_expired
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthLogoutRequest'
  /api/auth/me/:
    get:
      tags:
      - Auth
      summary: Inspect current anonymous, guest, or authenticated subject
      operationId: getCurrentAuthSubject
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: auth-me
      x-django-view: auth_me
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSubjectResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthErrorResponse'
          x-error-codes:
          - token_invalid
          - token_expired
      parameters:
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identity header when no Bearer token is supplied.
        schema:
          type: string
      - name: guest_id
        in: query
        required: false
        description: Optional query fallback for the guest identity.
        schema:
          type: string
      - name: session_id
        in: query
        required: false
        description: Optional chat session binding identifier.
        schema:
          type: string
  /api/files/:
    get:
      tags:
      - Files
      summary: List canonical file attachments visible to the current subject
      operationId: listFileAttachments
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-files
      x-django-view: attachments
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachmentListResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileGuestSessionErrorResponse'
          x-error-codes:
          - guest_session_invalid
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObjectAccessErrorResponse'
          x-error-codes:
          - object_access_denied
      parameters:
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identity header when no Bearer token is supplied.
        schema:
          type: string
      - name: session_id
        in: query
        required: false
        description: Optional chat session identifier used to scope file listing.
        schema:
          type: string
    post:
      tags:
      - Files
      summary: Upload or register a file attachment through the quarantine boundary
      operationId: uploadFileAttachment
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-files
      x-django-view: attachments
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachmentResponse'
        '400':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadValidationErrorResponse'
          x-error-codes:
          - session_id_required
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileGuestSessionErrorResponse'
          x-error-codes:
          - guest_session_invalid
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObjectAccessErrorResponse'
          x-error-codes:
          - object_access_denied
        '413':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadTooLargeErrorResponse'
          x-error-codes:
          - file_too_large
        '429':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileRateLimitErrorResponse'
          x-error-codes:
          - rate_limit_exceeded
        '503':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadStorageErrorResponse'
          x-error-codes:
          - upload_storage_unavailable
      parameters:
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identity header when no Bearer token is supplied.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
  /api/files/{attachment_id}/:
    get:
      tags:
      - Files
      summary: Read one canonical file attachment after owner authorization
      operationId: getFileAttachment
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-file-detail
      x-django-view: attachment_detail
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachmentDetailResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileGuestSessionErrorResponse'
          x-error-codes:
          - guest_session_invalid
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileObjectAccessErrorResponse'
          x-error-codes:
          - object_access_denied
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileAttachmentNotFoundErrorResponse'
          x-error-codes:
          - attachment_not_found
      parameters:
      - name: attachment_id
        in: path
        required: true
        description: Canonical uploaded-file identifier
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identity header when no Bearer token is supplied.
        schema:
          type: string
      - name: session_id
        in: query
        required: false
        description: Optional chat session identifier used to scope file listing.
        schema:
          type: string
  /api/analysis/jobs/:
    get:
      tags:
      - Analysis
      summary: List analysis jobs visible to the current subject
      operationId: listAnalysisJobs
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-analysis-jobs
      x-django-view: analysis_jobs
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobListResponse'
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - object_access_denied
      parameters:
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identity header when no Bearer token is supplied.
        schema:
          type: string
      - name: session_id
        in: query
        required: false
        description: Optional chat session identifier used to scope analysis job listing.
        schema:
          type: string
    post:
      tags:
      - Analysis
      summary: Queue an owner-scoped Supervisor analysis plan for asynchronous execution
      operationId: queueAnalysisJob
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-analysis-jobs
      x-django-view: analysis_jobs
      responses:
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobAcceptedResponse'
        '400':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - analysis_job_session_required
          - chat_input_rejected
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - object_access_denied
        '409':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - analysis_plan_not_executable
          - attachment_scan_blocked
          - analysis_job_id_conflict
          - analysis_job_reservation_pending
        '429':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - rate_limit_exceeded
        '503':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - analysis_job_unavailable
      parameters:
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identity header when no Bearer token is supplied.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalysisJobRequest'
  /api/analysis/jobs/{job_id}/:
    get:
      tags:
      - Analysis
      summary: Read one asynchronous analysis job after owner authorization
      operationId: getAnalysisJob
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-analysis-job-detail
      x-django-view: analysis_job_detail
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobDetailResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - guest_session_invalid
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - object_access_denied
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - analysis_job_not_found
      parameters:
      - name: job_id
        in: path
        required: true
        description: Canonical asynchronous analysis job identifier
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identity header when no Bearer token is supplied.
        schema:
          type: string
  /api/analysis/results/{job_id}/:
    get:
      tags:
      - Analysis
      summary: Read a completed result or pending state for an authorized analysis job
      operationId: getAnalysisResult
      security:
      - {}
      - bearerAuth: []
      x-contract-status: shadow
      x-django-route-name: canonical-analysis-result
      x-django-view: analysis_result
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResultResponse'
        '202':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisResultResponse'
        '401':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - guest_session_invalid
        '403':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - object_access_denied
        '404':
          description: Typed API error response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalysisJobErrorResponse'
          x-error-codes:
          - analysis_result_not_found
      parameters:
      - name: job_id
        in: path
        required: true
        description: Canonical asynchronous analysis job identifier
        schema:
          type: string
          minLength: 1
          maxLength: 128
      - name: X-Guest-Id
        in: header
        required: false
        description: Optional guest identity header when no Bearer token is supplied.
        schema:
          type: string
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AnalysisJobAccepted:
      additionalProperties: true
      properties:
        job_id:
          maxLength: 128
          minLength: 1
          title: Job Id
          type: string
        status:
          maxLength: 64
          minLength: 1
          title: Status
          type: string
        contract_version:
          maxLength: 64
          minLength: 1
          title: Contract Version
          type: string
        session_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Session Id
        message_id:
          anyOf:
          - maxLength: 128
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Message Id
        execution_mode:
          maxLength: 64
          minLength: 1
          title: Execution Mode
          type: string
      required:
      - job_id
      - status
      - contract_version
      - execution_mode
      title: AnalysisJobAccepted
      type: object
    AnalysisJobAcceptedResponse:
      additionalProperties: true
      properties:
        job:
          $ref: '#/components/schemas/AnalysisJobAccepted'
      required:
      - job
      title: AnalysisJobAcceptedResponse
      type: object
    AnalysisJobSummary:
      additionalProperties: true
      properties:
        job_id:
          maxLength: 128
          minLength: 1
