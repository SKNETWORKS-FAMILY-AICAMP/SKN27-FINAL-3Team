[project]
name = "road-environment-mcp"
version = "0.1.0"
description = "Road environment lookup and analysis MCP server"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2,<2",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.7,<3",
  "python-dotenv>=1.0,<2",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
